<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password – Freeze Ur Memories</title>
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/pages.css" />
    <style>
      .auth-page {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--space-16) var(--space-6);
        background: linear-gradient(135deg, #fce8f3, #f8ecf8, #eef6fc);
      }
      .auth-page-card {
        background: white;
        border-radius: var(--radius-2xl);
        padding: var(--space-10) var(--space-8);
        box-shadow: var(--shadow-xl);
        max-width: 480px;
        width: 100%;
        border: 2px solid rgba(232, 24, 122, 0.08);
      }
      .auth-page-icon {
        font-size: 3.5rem;
        text-align: center;
        margin-bottom: var(--space-4);
      }
      .auth-page-title {
        font-family: var(--font-display);
        font-size: var(--text-2xl);
        font-weight: 700;
        text-align: center;
        color: var(--color-text-dark);
        margin-bottom: var(--space-2);
      }
      .auth-page-desc {
        text-align: center;
        color: var(--color-text-light);
        font-size: var(--text-sm);
        margin-bottom: var(--space-8);
        line-height: var(--leading-relaxed);
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="container navbar-inner">
        <a href="../index.html" class="navbar-logo"
          ><div class="navbar-logo-icon">🖐️</div>
          <div class="navbar-logo-text">
            <span class="navbar-logo-name">Freeze Ur Memories</span
            ><span class="navbar-logo-tagline"
              >3D Casting & Impression Studio</span
            >
          </div></a
        >
        <div class="navbar-actions">
          <a href="account.html" class="btn btn-outline btn-sm"
            >← Back to Login</a
          >
        </div>
      </div>
    </nav>
    <div class="auth-page">
      <div class="auth-page-card">
        <div class="auth-page-icon">🔑</div>
        <h1 class="auth-page-title">Forgot Password?</h1>
        <p class="auth-page-desc">
          No worries! Enter your email address and we'll send you a link to
          reset your password.
        </p>
        <form id="forgotForm">
          <div class="form-group">
            <label class="form-label">Email Address *</label
            ><input
              type="email"
              class="form-control"
              placeholder="your@email.com"
              required
            />
          </div>
          <button
            type="submit"
            class="btn btn-primary btn-lg"
            style="width: 100%; justify-content: center"
          >
            📨 Send Reset Link
          </button>
        </form>
        <div
          id="successMsg"
          style="
            display: none;
            text-align: center;
            padding: var(--space-6);
            background: #e6f9f0;
            border-radius: var(--radius-lg);
            border: 1px solid #22863a;
            margin-top: var(--space-5);
          "
        >
          <div style="font-size: 2rem; margin-bottom: var(--space-2)">✅</div>
          <h3 style="color: #22863a; margin-bottom: var(--space-2)">
            Reset Link Sent!
          </h3>
          <p style="color: var(--color-text-light); font-size: var(--text-sm)">
            Check your email inbox for the password reset link. It expires in 30
            minutes.
          </p>
        </div>
        <div style="text-align: center; margin-top: var(--space-5)">
          <a
            href="account.html"
            style="
              color: var(--color-primary);
              font-size: var(--text-sm);
              font-weight: 600;
            "
            >← Back to Login</a
          >
        </div>
      </div>
    </div>
    <div class="toast-container"></div>
    <script src="../js/main.js"></script>
    <script>
      document.getElementById("forgotForm").addEventListener("submit", (e) => {
        e.preventDefault();
        document.getElementById("forgotForm").style.display = "none";
        document.getElementById("successMsg").style.display = "block";
        showToast("Password reset link sent to your email!", "success");
      });
    </script>
  </body>
</html>
